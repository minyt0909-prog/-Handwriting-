  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const FIREBASE_CONFIG = {
      apiKey: "",
      authDomain: "",
      databaseURL: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };

    window.CLOUD_ENABLED = Boolean(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
    if (window.CLOUD_ENABLED) {
      try {
        const app = initializeApp(FIREBASE_CONFIG);
        const db = getDatabase(app);
        window.FirebaseDB = { db, ref, set, onValue };
        window.addEventListener('DOMContentLoaded', () => {
          if (typeof window.onCloudReady === 'function') window.onCloudReady();
        });
      } catch (err) {
        console.warn("Firebase 연결 실패, 로컬 저장 모드로 작동합니다:", err);
        window.CLOUD_ENABLED = false;

      loadAll() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            const def = this.getDefaultData();
            this.saveAll(def);
            return def;
          }
          const parsed = JSON.parse(raw);
          if (!parsed.curriculum) parsed.curriculum = JSON.parse(JSON.stringify(DEFAULT_CURRICULUM));
          if (!parsed.students) parsed.students = {};
          if (!parsed.teacherPassword) parsed.teacherPassword = localStorage.getItem(TEACHER_PASS_KEY) || '1234';
          return parsed;
        } catch (e) {
          console.error("데이터 로드 실패:", e);
          return this.getDefaultData();
        }
      },

      saveAll(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          if (window.CLOUD_ENABLED && window.FirebaseDB) {
            const { db, ref, set } = window.FirebaseDB;
            set(ref(db, 'handwritingApp'), data).catch(err => console.warn("클라우드 동기화 오류:", err));

        } catch (e) {
          console.error("데이터 저장 실패:", e);
          showToast("저장 공간이 부족하여 일부 데이터를 저장하지 못했습니다.", "error");
        }
      }
    };

    window.onCloudReady = function () {
      if (!window.CLOUD_ENABLED || !window.FirebaseDB) return;
      const { db, ref, onValue } = window.FirebaseDB;
      onValue(ref(db, 'handwritingApp'), (snapshot) => {
        const val = snapshot.val();
        if (val) {
          AppState.data = val;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(val));
          renderApp();
        }
      });

     * =========================================================================
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const colorMap = {
        success: 'bg-mint border-mintDark text-cyan-950',
        error: 'bg-peach border-coral text-rose-950',
        warning: 'bg-butter border-amber-400 text-amber-950',
        info: 'bg-white border-lavenderDark text-cocoa'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto rounded-2xl border-2 px-4 py-3 shadow-cute text-sm font-bold transition-all duration-300 transform translate-y-0 ${colorMap[type] || colorMap.info}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function detectGradeFromId(studentId) {
      const firstChar = String(studentId || '').trim().charAt(0);
      if (firstChar === '2') return 2;
      if (firstChar === '3') return 3;
      return 1;
    }

    function formatNow() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function speakEnglish(text, rate = 0.92) {
      if (!('speechSynthesis' in window)) {
        showToast("이 브라우저에서는 음성 듣기(TTS)를 지원하지 않습니다.", "warning");
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = rate;
      utter.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.includes('en-US') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Natural')))
        || voices.find(v => v.lang.startsWith('en'));
      if (enVoice) utter.voice = enVoice;

      window.speechSynthesis.speak(utter);
    }

    /**
     * =========================================================================
     * 5. 4선지 필체 교정 캔버스 엔진 (S펜 & 터치 최적화)
     * =========================================================================
     */
    const CanvasManager = {
      canvas: null,
      ctx: null,
      isDrawing: false,
      currentColor: '#2D3748',
      currentWidth: 4.2,
      isEraser: false,
      step1Strokes: [],
      step2Strokes: [],
      currentStroke: null,

      resetSessionStrokes() {
        this.step1Strokes = [];
        this.step2Strokes = [];
        this.currentStroke = null;
      },

      getActiveStrokes() {
        return AppState.practiceStep === 1 ? this.step1Strokes : this.step2Strokes;
      },

      init() {
        this.canvas = document.getElementById('practice-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.resizeCanvas();

        this.canvas.onpointerdown = (e) => this.onPointerDown(e);
        this.canvas.onpointermove = (e) => this.onPointerMove(e);
        this.canvas.onpointerup = (e) => this.onPointerUp(e);
        this.canvas.onpointercancel = (e) => this.onPointerUp(e);
      },

      resizeCanvas() {
        if (!this.canvas) return;
        const rect = this.canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(300, rect.width);
        const height = window.innerWidth < 640 ? 270 : 320;

        this.canvas.width = width * dpr;
        this.canvas.height = height * dpr;
        this.canvas.style.height = `${height}px`;

        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.redraw();
      },

      getNormalizedPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) / rect.width,
          y: (e.clientY - rect.top) / rect.height,
          pressure: e.pressure && e.pressure > 0 ? e.pressure : 0.5
        };
      },

      onPointerDown(e) {
        e.preventDefault();
        this.canvas.setPointerCapture(e.pointerId);
        this.isDrawing = true;
        const pt = this.getNormalizedPos(e);
        this.currentStroke = {
          color: this.isEraser ? '#FFFFFF' : this.currentColor,
          width: this.isEraser ? 18 : this.currentWidth,
          isEraser: this.isEraser,
          points: [pt]
        };
        this.getActiveStrokes().push(this.currentStroke);
        this.redraw();
      },

      onPointerMove(e) {
        if (!this.isDrawing || !this.currentStroke) return;
        e.preventDefault();
        const pt = this.getNormalizedPos(e);
        this.currentStroke.points.push(pt);
        this.redraw();
      },

      onPointerUp(e) {
        if (!this.isDrawing) return;
        this.isDrawing = false;
        this.currentStroke = null;
        this.redraw();
      },

      undo() {
        const strokes = this.getActiveStrokes();
        if (strokes.length > 0) {
          strokes.pop();
          this.redraw();
        }
      },

      clearCurrentStep() {
        if (AppState.practiceStep === 1) {
          this.step1Strokes = [];
        } else {
          this.step2Strokes = [];
        }
        this.redraw();
      },

      drawFourLinesAndGuide(ctx, w, h, step, lesson) {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);

        const rows = [
          { top: h * 0.13, height: h * 0.30, text: lesson ? lesson.words : '', label: '단어 연습' },
          { top: h * 0.56, height: h * 0.30, text: lesson ? lesson.sentence : '', label: '문장 연습' }
        ];

        rows.forEach((row) => {
          const line1 = row.top;
          const line2 = row.top + row.height * 0.34;
          const line3 = row.top + row.height * 0.68;
          const line4 = row.top + row.height;

          ctx.fillStyle = 'rgba(224, 247, 250, 0.25)';
          ctx.fillRect(0, line2, w, line3 - line2);

          // 1번선 (빨간선)
          ctx.beginPath();
          ctx.strokeStyle = '#FF8A80';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([]);
          ctx.moveTo(16, line1);
          ctx.lineTo(w - 16, line1);
          ctx.stroke();

          // 2번선 (가운데 점선)
          ctx.beginPath();
          ctx.strokeStyle = '#90CAF9';
          ctx.lineWidth = 1.3;
          ctx.setLineDash([6, 6]);
          ctx.moveTo(16, line2);
          ctx.lineTo(w - 16, line2);
          ctx.stroke();

          // 3번선 (파란 기준선)
          ctx.beginPath();
          ctx.strokeStyle = '#29B6F6';
          ctx.lineWidth = 1.8;
          ctx.setLineDash([]);
          ctx.moveTo(16, line3);
          ctx.lineTo(w - 16, line3);
          ctx.stroke();

          // 4번선 (바닥선)
          ctx.beginPath();
          ctx.strokeStyle = '#F8BBD0';
          ctx.lineWidth = 1.3;
          ctx.setLineDash([]);
          ctx.moveTo(16, line4);
          ctx.lineTo(w - 16, line4);
          ctx.stroke();

          ctx.fillStyle = '#A1887F';
          ctx.font = 'bold 11px "Gowun Dodum", sans-serif';
          ctx.fillText(row.label, 18, line1 - 5);

          if (step === 1 && row.text) {
            const baseFontSize = Math.min(row.height * 0.64, w / Math.max(row.text.length * 0.56, 12));
            ctx.save();
            ctx.font = `700 ${Math.max(20, baseFontSize)}px "Patrick Hand", "Comic Neue", cursive`;
            ctx.fillStyle = 'rgba(120, 144, 156, 0.28)';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(row.text, 26, line3 - 2);
            ctx.restore();
          }
        });
      },

      drawStrokes(ctx, w, h, strokes) {
        strokes.forEach(stroke => {
          if (!stroke.points || stroke.points.length === 0) return;
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = stroke.color;

          if (stroke.points.length === 1) {
            const p = stroke.points[0];
            ctx.fillStyle = stroke.color;
            ctx.beginPath();
            ctx.arc(p.x * w, p.y * h, stroke.width / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.lineWidth = stroke.width;
            ctx.moveTo(stroke.points[0].x * w, stroke.points[0].y * h);
            for (let i = 1; i < stroke.points.length; i++) {
              const prev = stroke.points[i - 1];
              const curr = stroke.points[i];
              const midX = ((prev.x + curr.x) / 2) * w;
              const midY = ((prev.y + curr.y) / 2) * h;
              ctx.quadraticCurveTo(prev.x * w, prev.y * h, midX, midY);
            }
            const last = stroke.points[stroke.points.length - 1];
            ctx.lineTo(last.x * w, last.y * h);
            ctx.stroke();
          }
          ctx.restore();
        });
      },

      redraw() {
        if (!this.canvas || !this.ctx) return;
        const rect = this.canvas.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        const lesson = (AppState.data.curriculum[AppState.activeGrade] || []).find(l => l.session === AppState.activeSession);

        this.drawFourLinesAndGuide(this.ctx, w, h, AppState.practiceStep, lesson);
        this.drawStrokes(this.ctx, w, h, this.getActiveStrokes());
      },

      exportStepImage(step) {
        const strokes = step === 1 ? this.step1Strokes : this.step2Strokes;
        if (!strokes || strokes.length === 0) return null;

        const off = document.createElement('canvas');
        const w = 760;
        const h = 300;
        off.width = w;
        off.height = h;
        const octx = off.getContext('2d');
        const lesson = (AppState.data.curriculum[AppState.activeGrade] || []).find(l => l.session === AppState.activeSession);

        this.drawFourLinesAndGuide(octx, w, h, step, lesson);
        this.drawStrokes(octx, w, h, strokes);
        return off.toDataURL('image/png', 0.85);
      }
    };

    /**
     * =========================================================================
     * 6. 교사 빨간펜 직접 첨삭 캔버스 매니저 (TeacherPenManager)
     * =========================================================================
     */
    const TeacherPenManager = {
      canvas: null,
      ctx: null,
      isDrawing: false,
      penColor: '#E53935',
      strokes: [],
      currentStroke: null,

      init() {
        this.canvas = document.getElementById('teacher-overlay-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        const rect = this.canvas.getBoundingClientRect();
        this.canvas.width = Math.max(300, rect.width);
        this.canvas.height = Math.max(150, rect.height);

        this.canvas.onpointerdown = (e) => {
          e.preventDefault();
          this.canvas.setPointerCapture(e.pointerId);
          this.isDrawing = true;
          const r = this.canvas.getBoundingClientRect();
          this.currentStroke = {
            color: this.penColor,
            points: [{ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }]
          };
          this.strokes.push(this.currentStroke);
          this.redraw();
        };

        this.canvas.onpointermove = (e) => {
          if (!this.isDrawing || !this.currentStroke) return;
          e.preventDefault();
          const r = this.canvas.getBoundingClientRect();
          this.currentStroke.points.push({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height });
          this.redraw();
        };

        this.canvas.onpointerup = () => {
          this.isDrawing = false;
          this.currentStroke = null;
        };
      },

      undo() {
        this.strokes.pop();
        this.redraw();
      },

      clear() {
        this.strokes = [];
        this.redraw();
      },

      redraw() {
        if (!this.canvas || !this.ctx) return;
        const w = this.canvas.width;
        const h = this.canvas.height;
        this.ctx.clearRect(0, 0, w, h);

        this.strokes.forEach(s => {
          if (!s.points.length) return;
          this.ctx.save();
          this.ctx.strokeStyle = s.color;
          this.ctx.lineWidth = 3.5;
          this.ctx.lineCap = 'round';
          this.ctx.lineJoin = 'round';
          this.ctx.beginPath();
          this.ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
          for (let i = 1; i < s.points.length; i++) {
            this.ctx.lineTo(s.points[i].x * w, s.points[i].y * h);
          }
          this.ctx.stroke();
          this.ctx.restore();
        });
      },

      exportOverlayImage() {
        if (!this.canvas || this.strokes.length === 0) return null;
        return this.canvas.toDataURL('image/png');
      }
    };

    window.addEventListener('resize', () => {
      if (AppState.role === 'student' && AppState.studentTab === 'practice') {
        CanvasManager.resizeCanvas();
      }
    });

      } else if (AppState.role === 'teacher') {
        app.innerHTML = renderTeacherLayout();
        if (AppState.reviewingStudentId && AppState.reviewingSession) {
          setTimeout(() => TeacherPenManager.init(), 0);
        }
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    function handleStudentLogin(e) {
      e.preventDefault();
      const id = document.getElementById('stu-id').value.trim();
      const pw = document.getElementById('stu-pw').value.trim();

      if (!id || !pw) {
        showToast("학번과 비밀번호를 모두 입력해 주세요!", "warning");
        return;
      }

      const existing = AppState.data.students[id];
      if (existing) {
        if (existing.password !== pw) {
          showToast("비밀번호가 일치하지 않아요. 다시 확인해 주세요!", "error");
          return;
        }
      } else {
        const grade = detectGradeFromId(id);
        AppState.data.students[id] = {
          id,
          password: pw,
          grade,
          submissions: {}
        };
        StorageService.saveAll(AppState.data);
        showToast(`${id} 학생 계정으로 새로 등록되었어요!`, "success");
      }

      AppState.role = 'student';
      AppState.currentStudentId = id;
      AppState.activeGrade = AppState.data.students[id].grade || detectGradeFromId(id);
      AppState.studentTab = 'sessions';
      renderApp();
    }

    function handleTeacherLogin(e) {
      e.preventDefault();
      const pw = document.getElementById('teacher-pw').value.trim();
      if (pw === AppState.data.teacherPassword) {
        AppState.role = 'teacher';
        AppState.teacherTab = 'students';
        renderApp();
        showToast("교사 대시보드에 접속했습니다.", "success");
      } else {
        showToast("교사 비밀번호가 올바르지 않습니다.", "error");
      }
    }

    function logout() {
      AppState.role = null;
      AppState.currentStudentId = null;
      AppState.reviewingStudentId = null;
      AppState.reviewingSession = null;
      renderApp();
    }

              </div>
            </div>
            <button onclick="openSessionPractice(${unreadFeedbacks[0].session})"
              class="px-4 py-2 rounded-2xl bg-coral hover:bg-rose-500 text-white text-xs sm:text-sm font-bold shadow-cute-sm cursor-pointer">
              바로 확인하러 가기 →
            </button>
          </div>
        ` : ''}

        <main class="flex-1">
          ${AppState.studentTab === 'sessions' ? renderStudentSessionsView(student) : ''}
          ${AppState.studentTab === 'practice' ? renderStudentPracticeView(student) : ''}
        </main>
      `;
    }

    function switchStudentTab(tab) {
      AppState.studentTab = tab;
      renderApp();
    }

    function openStudentNotifications() {
      const student = AppState.data.students[AppState.currentStudentId];
      const subs = Object.values(student.submissions || {}).filter(s => s.status === 'feedback_done' || s.status === 'resubmit_needed');
      if (subs.length === 0) {
        showToast("아직 도착한 선생님 피드백 알림이 없어요!", "info");
        return;
      }
      subs.sort((a, b) => (a.notified === b.notified ? b.session - a.session : a.notified ? 1 : -1));
      openSessionPractice(subs[0].session);
    }

    function renderStudentSessionsView(student) {
      const lessons = AppState.data.curriculum[AppState.activeGrade] || [];
      const subs = student.submissions || {};
      const completedCount = Object.values(subs).filter(s => s.status === 'submitted' || s.status === 'feedback_done').length;

      return `
        <div class="bg-white/95 rounded-3xl border-3 border-skySoft p-5 sm:p-6 shadow-cute">
          <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b-2 border-dashed border-stone-200">
            <div>
              <h2 class="font-cute text-3xl font-bold text-cocoa">중학교 ${AppState.activeGrade}학년 · 10차시 필체 교정 로드맵</h2>
              <p class="text-xs sm:text-sm text-stone-500 mt-0.5">차시를 눌러 원어민 발음을 듣고 4선지 노트에 차근차근 따라 써 보세요!</p>
            </div>

            <div class="flex items-center gap-2 bg-cream p-1.5 rounded-2xl border-2 border-stone-200">
              ${[1, 2, 3].map(g => `
                <button onclick="changeStudentViewGrade(${g})"
                  class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer ${AppState.activeGrade === g ? 'bg-skyDark text-white shadow-cute-sm' : 'text-stone-600 hover:bg-white'}">
                  중${g} 과정
                </button>
              `).join('')}
            </div>
          </div>

          <div class="mb-6 bg-cream rounded-2xl p-4 border-2 border-mint">
            <div class="flex items-center justify-between text-xs sm:text-sm font-bold mb-1.5">
              <span>🌱 나의 10차시 완주 현황</span>
              <span class="text-teal-700">${completedCount} / 10 차시 완료</span>
            </div>
            <div class="w-full h-3.5 bg-white rounded-full overflow-hidden border border-mintDark">
              <div class="h-full bg-gradient-to-r from-mintDark to-skyDark rounded-full transition-all duration-500" style="width: ${completedCount * 10}%"></div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4">
            ${lessons.map(lesson => {
              const sub = subs[lesson.session];
              let badge = `<span class="px-2.5 py-1 rounded-full bg-stone-100 text-stone-500 text-xs font-bold">미제출</span>`;
              let cardBorder = 'border-stone-200 hover:border-mintDark';

              if (sub) {
                if (sub.status === 'resubmit_needed') {
                  badge = `<span class="px-2.5 py-1 rounded-full bg-coral text-white text-xs font-bold">🔄 재제출 필요</span>`;
                  cardBorder = 'border-coral bg-rose-50/40';
                } else if (sub.status === 'feedback_done') {
                  badge = `<span class="px-2.5 py-1 rounded-full bg-lavenderDark text-white text-xs font-bold">💌 선생님 피드백 완료</span>`;
                  cardBorder = 'border-lavenderDark bg-lavender/20';
                } else if (sub.status === 'submitted') {
                  badge = `<span class="px-2.5 py-1 rounded-full bg-mint text-teal-900 text-xs font-bold">✅ 제출 완료</span>`;
                  cardBorder = 'border-mintDark bg-mint/15';
                }
              }

              return `
                <div onclick="openSessionPractice(${lesson.session})"
                  class="rounded-3xl border-2 ${cardBorder} p-4 sm:p-5 transition transform hover:-translate-y-0.5 cursor-pointer bg-white shadow-cute-sm flex flex-col justify-between gap-3">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-2">
                      <span class="font-cute text-xl font-bold text-sky-700">${lesson.title}</span>
                      ${badge}
                    </div>
                    <p class="font-hand text-xl text-cocoa font-bold truncate">"${lesson.sentence}"</p>
                    <p class="text-xs text-stone-500 mt-1">${lesson.meaning}</p>
                  </div>
                  <div class="flex items-center justify-between pt-2 border-t border-stone-100 text-xs">
                    <span class="text-stone-400">핵심 단어: <strong class="text-stone-600">${lesson.words}</strong></span>
                    <span class="font-bold text-teal-600">연습하기 →</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function changeStudentViewGrade(grade) {
      AppState.activeGrade = grade;
      renderApp();
    }

    function openSessionPractice(sessionNum) {
      AppState.activeSession = sessionNum;
      AppState.practiceStep = 1;
      AppState.studentTab = 'practice';
      CanvasManager.resetSessionStrokes();

      const student = AppState.data.students[AppState.currentStudentId];
      if (student && student.submissions && student.submissions[sessionNum]) {
        if (!student.submissions[sessionNum].notified) {
          student.submissions[sessionNum].notified = true;
          StorageService.saveAll(AppState.data);
        }
      }
      renderApp();
    }

    function renderStudentPracticeView(student) {
      const lessons = AppState.data.curriculum[AppState.activeGrade] || [];
      const lesson = lessons.find(l => l.session === AppState.activeSession) || lessons[0];
      const existingSub = (student.submissions || {})[lesson.session];

      return `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <button onclick="switchStudentTab('sessions')"
              class="px-4 py-2 rounded-2xl bg-white border-2 border-stone-200 hover:border-cocoa text-sm font-bold text-cocoa shadow-cute-sm cursor-pointer">
              ← 10차시 목록으로
            </button>
            <span class="px-3.5 py-1.5 rounded-full bg-butter border border-amber-300 text-xs font-bold text-amber-900">
              중${AppState.activeGrade} · ${lesson.title}
            </span>
          </div>

          ${existingSub && (existingSub.teacherComment || existingSub.teacherOverlayImg) ? `
            <div class="rounded-3xl border-3 ${existingSub.status === 'resubmit_needed' ? 'border-coral bg-rose-50' : 'border-lavenderDark bg-lavender/40'} p-4 sm:p-5 shadow-cute">
              <div class="flex items-center justify-between mb-2">
                <h3 class="font-cute text-2xl font-bold text-cocoa flex items-center gap-2">
                  <span>👩‍🏫 선생님의 빨간펜 피드백</span>
                  ${existingSub.status === 'resubmit_needed'
                    ? '<span class="px-2.5 py-0.5 rounded-full bg-coral text-white text-xs font-sans">재제출이 필요해요!</span>'
                    : '<span class="px-2.5 py-0.5 rounded-full bg-lavenderDark text-white text-xs font-sans">참 잘했어요!</span>'}
                </h3>
              </div>
              ${existingSub.teacherComment ? `
                <p class="bg-white rounded-2xl p-3.5 text-sm text-cocoa border border-stone-200 mb-3">
                  💬 "${existingSub.teacherComment}"
                </p>
              ` : ''}
              ${existingSub.step2Img ? `
                <div class="mt-2">
                  <p class="text-xs font-bold text-stone-600 mb-1.5">📌 선생님이 직접 첨삭해 주신 내 글씨:</p>
                  <div class="relative inline-block max-w-full rounded-2xl overflow-hidden border-2 border-stone-300 bg-white">
                    <img src="${existingSub.step2Img}" alt="내 제출 필체" class="max-h-48 w-auto block" />
                    ${existingSub.teacherOverlayImg ? `<img src="${existingSub.teacherOverlayImg}" alt="교사 펜 첨삭" class="absolute inset-0 w-full h-full object-contain pointer-events-none" />` : ''}
                  </div>
                </div>
              ` : ''}
            </div>
          ` : ''}

          <!-- 예문 & 원어민 TTS 듣기 카드 -->
          <div class="bg-white/95 rounded-3xl border-3 border-mintDark p-4 sm:p-5 shadow-cute">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-cream rounded-2xl p-3.5 border border-amber-200 flex flex-col justify-between">
                <div>
                  <span class="text-[11px] font-bold text-amber-700 bg-butter px-2 py-0.5 rounded-full">STEP A · 핵심 단어 듣기</span>
                  <p class="font-hand text-2xl font-bold text-cocoa mt-1.5">${lesson.words}</p>
                </div>
                <div class="flex items-center gap-2 mt-3">
                  <button onclick="speakEnglish('${lesson.words.replace(/'/g, "\\'")}', 0.9)"
                    class="px-3 py-1.5 rounded-xl bg-amber-400 hover:bg-amber-500 text-white text-xs font-bold flex items-center gap-1 shadow-cute-sm cursor-pointer">
                    🔊 단어 듣기
                  </button>
                  <button onclick="speakEnglish('${lesson.words.replace(/'/g, "\\'")}', 0.65)"
                    class="px-3 py-1.5 rounded-xl bg-white border border-amber-300 text-amber-900 text-xs font-bold cursor-pointer">
                    🐢 느리게
                  </button>
                </div>
              </div>

              <div class="bg-skySoft/50 rounded-2xl p-3.5 border border-sky-200 flex flex-col justify-between">
                <div>
                  <span class="text-[11px] font-bold text-sky-800 bg-sky-200/70 px-2 py-0.5 rounded-full">STEP B · 예문 듣고 뜻 이해하기</span>
                  <p class="font-hand text-2xl font-bold text-cocoa mt-1.5">"${lesson.sentence}"</p>
                  <p class="text-xs sm:text-sm text-stone-600 mt-1">뜻: ${lesson.meaning}</p>
                </div>
                <div class="flex items-center gap-2 mt-3">
                  <button onclick="speakEnglish('${lesson.sentence.replace(/'/g, "\\'")}', 0.92)"
                    class="px-3 py-1.5 rounded-xl bg-skyDark hover:bg-sky-500 text-white text-xs font-bold flex items-center gap-1 shadow-cute-sm cursor-pointer">
                    🔊 문장 듣기
                  </button>
                  <button onclick="speakEnglish('${lesson.sentence.replace(/'/g, "\\'")}', 0.65)"
                    class="px-3 py-1.5 rounded-xl bg-white border border-sky-300 text-sky-900 text-xs font-bold cursor-pointer">
                    🐢 천천히 듣기
                  </button>
                </div>
              </div>
            </div>

            <div class="mt-3 px-3.5 py-2 rounded-2xl bg-lavender/40 text-xs text-purple-950 flex items-center gap-2">
              <span>💡</span>
              <span><strong>필체 교정 포인트:</strong> ${lesson.tip}</span>
            </div>
          </div>

          <!-- 4선지 S펜 필체 교정 캔버스 영역 -->
          <div class="bg-white rounded-3xl border-4 border-cocoa/15 p-4 sm:p-5 shadow-cute">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
              <div class="flex items-center gap-2 bg-cream p-1.5 rounded-2xl border-2 border-stone-200">
                <button onclick="setPracticeStep(1)"
                  class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer ${AppState.practiceStep === 1 ? 'bg-mintDark text-white shadow-cute-sm' : 'text-stone-600 hover:bg-white'}">
                  1단계: 연하게 따라쓰기
                </button>
                <button onclick="setPracticeStep(2)"
                  class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer ${AppState.practiceStep === 2 ? 'bg-coral text-white shadow-cute-sm' : 'text-stone-600 hover:bg-white'}">
                  2단계: 혼자 스스로 쓰기
                </button>
              </div>

              <!-- 펜 색상 · 굵기 · 지우개 도구 -->
              <div class="flex items-center gap-1.5 flex-wrap">
                ${[
                  { color: '#2D3748', label: '연필흑색' },
                  { color: '#1D4ED8', label: '파란펜' },
                  { color: '#047857', label: '초록펜' }
                ].map(p => `
                  <button onclick="selectPenColor('${p.color}')" title="${p.label}"
                    class="w-8 h-8 rounded-full border-2 transition cursor-pointer ${!CanvasManager.isEraser && CanvasManager.currentColor === p.color ? 'scale-110 border-amber-400 ring-2 ring-amber-300' : 'border-white shadow-xs'}"
                    style="background-color: ${p.color};">
                  </button>
                `).join('')}

                <button onclick="toggleEraser()"
                  class="px-2.5 py-1.5 rounded-xl text-xs font-bold border transition cursor-pointer ${CanvasManager.isEraser ? 'bg-amber-200 border-amber-500 text-amber-950' : 'bg-stone-100 border-stone-200 text-stone-600'}">
                  🧽 지우개
                </button>
                <button onclick="CanvasManager.undo()"
                  class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 cursor-pointer">
                  ↩️ 되돌리기
                </button>
                <button onclick="CanvasManager.clearCurrentStep()"
                  class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-700 cursor-pointer">
                  🗑️ 전체 지우기
                </button>
              </div>
            </div>

            <div class="text-xs text-stone-500 mb-2 flex items-center justify-between">
              <span>
                ${AppState.practiceStep === 1
                  ? '✍️ 연한 회색 가이드 글씨 위를 터치펜(S펜)으로 정성껏 따라 써 보세요!'
                  : '🌟 이제 가이드 없이 4선지 줄 높이에 맞춰 혼자서 반듯하게 써 보세요!'}
              </span>
              <span class="hidden sm:inline text-[11px] text-stone-400">빨간선(1번) · 점선(2번) · 파란기준선(3번) · 바닥선(4번)</span>
            </div>

            <div class="w-full rounded-2xl overflow-hidden border-2 border-sky-200 bg-white shadow-inner">
              <canvas id="practice-canvas" class="w-full block cursor-crosshair"></canvas>
            </div>

            <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
              ${AppState.practiceStep === 1 ? `
                <span class="text-xs text-stone-500">1단계 따라쓰기를 마친 뒤 <strong>2단계 혼자 쓰기</strong>로 넘어가세요!</span>
                <button onclick="setPracticeStep(2)"
                  class="px-5 py-3 rounded-2xl bg-skyDark hover:bg-sky-500 text-white font-cute text-xl font-bold shadow-cute cursor-pointer">
                  다음 단계 (혼자 쓰기) →
                </button>
              ` : `
                <button onclick="setPracticeStep(1)"
                  class="px-4 py-2.5 rounded-2xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs sm:text-sm font-bold cursor-pointer">
                  ← 1단계 다시 보기
                </button>
                <button onclick="submitPracticeWork()"
                  class="px-6 py-3 rounded-2xl bg-coral hover:bg-rose-500 text-white font-cute text-2xl font-bold shadow-cute transition cursor-pointer">
                  ${existingSub ? '🔄 선생님께 재제출하기!' : '📮 선생님께 제출하기!'}
                </button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function setPracticeStep(step) {
      AppState.practiceStep = step;
      renderApp();
    }

    function selectPenColor(color) {
      CanvasManager.isEraser = false;
      CanvasManager.currentColor = color;
      renderApp();
    }

    function toggleEraser() {
      CanvasManager.isEraser = !CanvasManager.isEraser;
      renderApp();
    }

    function submitPracticeWork() {
      if (CanvasManager.step2Strokes.length === 0) {
        showToast("2단계 '혼자 스스로 쓰기' 4선지에 영어 문장을 먼저 작성해 주세요!", "warning");
        return;
      }

      const step1Img = CanvasManager.exportStepImage(1);
      const step2Img = CanvasManager.exportStepImage(2);
      const student = AppState.data.students[AppState.currentStudentId];

      if (!student.submissions) student.submissions = {};
      student.submissions[AppState.activeSession] = {
        session: AppState.activeSession,
        grade: AppState.activeGrade,
        step1Img,
        step2Img,
        submittedAt: formatNow(),
        status: 'submitted',
        teacherComment: '',
        teacherOverlayImg: null,
        notified: true
      };

      StorageService.saveAll(AppState.data);
      showToast(`${AppState.activeSession}차시 필체 연습이 선생님께 제출되었어요! 🎉`, "success");
      AppState.studentTab = 'sessions';
      renderApp();
    }

    /**
     * =========================================================================
     * 9. 교사 대시보드 (학생 포트폴리오 열람, 빨간펜 첨삭, 일괄 등록 & 설정)
     * =========================================================================
     */
    function renderTeacherLayout() {
      return `
        <header class="bg-white/95 backdrop-blur rounded-3xl border-3 border-lavenderDark px-4 sm:px-6 py-4 shadow-cute mb-5 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-lavender flex items-center justify-center text-2xl shadow-cute-sm">👩‍🏫</div>
            <div>
              <h1 class="font-cute text-2xl sm:text-3xl font-bold text-cocoa">교사 대시보드 · ENGLISH HANDWRITING</h1>
              <p class="text-xs text-stone-500">학생별 누적 포트폴리오 확인 · 직접 빨간펜 첨삭 · 학생 명단 일괄 등록</p>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="switchTeacherTab('students')"
              class="px-4 py-2 rounded-2xl text-xs sm:text-sm font-bold transition cursor-pointer ${AppState.teacherTab === 'students' ? 'bg-lavenderDark text-white shadow-cute-sm' : 'bg-cream text-cocoa hover:bg-lavender/40'}">
              📋 학생 포트폴리오 · 첨삭
            </button>
            <button onclick="switchTeacherTab('curriculum')"
              class="px-4 py-2 rounded-2xl text-xs sm:text-sm font-bold transition cursor-pointer ${AppState.teacherTab === 'curriculum' ? 'bg-lavenderDark text-white shadow-cute-sm' : 'bg-cream text-cocoa hover:bg-lavender/40'}">
              ⚙️ 학생 일괄등록 · 설정 관리
            </button>
            <button onclick="logout()"
              class="px-3 py-2 rounded-2xl text-xs font-bold bg-stone-100 hover:bg-stone-200 text-stone-600 cursor-pointer">
              로그아웃
            </button>
          </div>
        </header>

        <main class="flex-1">
          ${AppState.teacherTab === 'students' ? renderTeacherStudentsView() : renderTeacherSettingsView()}
        </main>

        ${AppState.reviewingStudentId && AppState.reviewingSession ? renderTeacherFeedbackModal() : ''}
      `;
    }

    function switchTeacherTab(tab) {
      AppState.teacherTab = tab;
      renderApp();
    }

    function renderTeacherStudentsView() {
      const students = Object.values(AppState.data.students || {});
      const filteredStudents = students.filter(stu => {
        if (AppState.teacherFilterGrade !== 'all' && String(stu.grade) !== String(AppState.teacherFilterGrade)) return false;
        if (AppState.teacherFilterStatus === 'pending') {
          return Object.values(stu.submissions || {}).some(s => s.status === 'submitted');
        }
        return true;
      }).sort((a, b) => a.id.localeCompare(b.id));

      return `
        <div class="bg-white/95 rounded-3xl border-3 border-lavender p-5 sm:p-6 shadow-cute">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b-2 border-dashed border-stone-200">
            <div>
              <h2 class="font-cute text-3xl font-bold text-cocoa">학생 누적 포트폴리오 & 피드백 현황</h2>
              <p class="text-xs text-stone-500">차시 버튼을 클릭하면 학생이 쓴 4선지 글씨 위에 직접 빨간펜으로 첨삭할 수 있습니다.</p>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
              <select onchange="setTeacherGradeFilter(this.value)"
                class="rounded-2xl border-2 border-stone-200 bg-cream px-3 py-2 text-xs sm:text-sm font-bold text-cocoa">
                <option value="all" ${AppState.teacherFilterGrade === 'all' ? 'selected' : ''}>전체 학년 (${students.length}명)</option>
                <option value="1" ${AppState.teacherFilterGrade === '1' ? 'selected' : ''}>중학교 1학년</option>
                <option value="2" ${AppState.teacherFilterGrade === '2' ? 'selected' : ''}>중학교 2학년</option>
                <option value="3" ${AppState.teacherFilterGrade === '3' ? 'selected' : ''}>중학교 3학년</option>
              </select>

              <select onchange="setTeacherStatusFilter(this.value)"
                class="rounded-2xl border-2 border-stone-200 bg-cream px-3 py-2 text-xs sm:text-sm font-bold text-cocoa">
                <option value="all" ${AppState.teacherFilterStatus === 'all' ? 'selected' : ''}>모든 학생 보기</option>
                <option value="pending" ${AppState.teacherFilterStatus === 'pending' ? 'selected' : ''}>⏳ 미첨삭 제출물 있는 학생</option>
              </select>
            </div>
          </div>

          ${filteredStudents.length === 0 ? `
            <div class="text-center py-12 bg-cream rounded-3xl border-2 border-dashed border-stone-200">

    function insertSampleBulkRows() {
      const ta = document.getElementById('bulk-student-textarea');
      if (!ta) return;
      ta.value = "10101\t1234\n10102\t1234\n20101\t2222\n30101\t3333";
    }

    function processBulkStudents() {
      const ta = document.getElementById('bulk-student-textarea');
      if (!ta || !ta.value.trim()) {
        showToast("등록할 학번과 비밀번호 목록을 붙여넣어 주세요!", "warning");
        return;
      }

      const lines = ta.value.trim().split(/\r?\n/);
      let count = 0;

      lines.forEach(line => {
        const cols = line.split(/[\t,]+/).map(c => c.trim()).filter(Boolean);
        if (cols.length === 0) return;

        let grade = null;
        let id = '';
        let pw = '';

        // 3열 입력 시: [학년, 학번, 비밀번호]
        if (cols.length >= 3 && ['1', '2', '3'].includes(cols[0])) {
          grade = Number(cols[0]);
          id = cols[1];
          pw = cols[2];
        } else {
          // 1~2열 입력 시: [학번, (선택)비밀번호]
          id = cols[0];
          pw = cols[1] || '';
          grade = detectGradeFromId(id);
        }

        if (!id || isNaN(Number(id.charAt(0)))) return;
        if (!pw) {
          pw = AppState.bulkDefaultPwMode === 'id' ? id : '1234';
        }

        const existing = AppState.data.students[id];
        AppState.data.students[id] = {
          id,
          password: pw,
          grade,
          submissions: existing ? (existing.submissions || {}) : {}
        };
        count++;
      });

      if (count === 0) {
        showToast("올바른 학번 형식을 찾지 못했습니다. (예: 10101 1234)", "error");
        return;
      }

      StorageService.saveAll(AppState.data);
      ta.value = '';
      showToast(`총 ${count}명의 학생 계정이 일괄 등록되었습니다!`, "success");
      renderApp();
    }

    function resetStudentPwToId(id) {
      if (!AppState.data.students[id]) return;
      AppState.data.students[id].password = id;
      StorageService.saveAll(AppState.data);
      showToast(`학번 ${id}의 비밀번호가 학번(${id})으로 초기화되었습니다.`, "info");
      renderApp();
    }

    function deleteStudentAccount(id) {
      if (!AppState.data.students[id]) return;
      delete AppState.data.students[id];
      StorageService.saveAll(AppState.data);
      showToast(`학번 ${id} 계정이 삭제되었습니다.`, "info");
      renderApp();
    }

    function updateCurriculumField(grade, idx, field, value) {
      if (!AppState.data.curriculum[grade] || !AppState.data.curriculum[grade][idx]) return;
      AppState.data.curriculum[grade][idx][field] = value;
      StorageService.saveAll(AppState.data);
      showToast(`${grade}학년 ${idx + 1}차시 내용이 저장되었습니다.`, "info");
    }

    function changeTeacherPassword() {
      const newPw = document.getElementById('new-teacher-pw').value.trim();
      if (!newPw) {
        showToast("새 비밀번호를 입력해 주세요.", "warning");
        return;
      }
      AppState.data.teacherPassword = newPw;
      localStorage.setItem(TEACHER_PASS_KEY, newPw);
      StorageService.saveAll(AppState.data);
      showToast("교사 비밀번호가 안전하게 변경되었습니다!", "success");
    }

    function exportAllDataJSON() {
      const blob = new Blob([JSON.stringify(AppState.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `english-handwriting-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("전체 학습 데이터가 JSON 파일로 다운로드되었습니다!", "success");
    }

    window.addEventListener('DOMContentLoaded', () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
      renderApp();
    });
  </script>
</body>
</html>
