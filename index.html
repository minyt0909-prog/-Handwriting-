    const DEFAULT_APP_DATA = {
      teacherPassword: "1234",
      curriculum: DEFAULT_CURRICULUM,

    // =========================================================================
    // 3. 통합 클라우드 & 로컬 스토리지 서비스
    // =========================================================================
    const StorageService = {
      LOCAL_KEY: 'english_handwriting_app_v5',
      CLOUD_ROOT: 'english_handwriting_v5',

      loadLocal() {
        try {
          const raw = localStorage.getItem(this.LOCAL_KEY);
          if (!raw) return JSON.parse(JSON.stringify(DEFAULT_APP_DATA));
          const parsed = JSON.parse(raw);
          return {
            teacherPassword: parsed.teacherPassword || "1234",
            curriculum: parsed.curriculum || JSON.parse(JSON.stringify(DEFAULT_CURRICULUM)),
            students: parsed.students || {},
            submissions: parsed.submissions || {},
            notifications: parsed.notifications || {}
          };
        } catch (e) {
          return JSON.parse(JSON.stringify(DEFAULT_APP_DATA));
        }
      },

      saveLocal(data) {
        try {
          localStorage.setItem(this.LOCAL_KEY, JSON.stringify(data));
        } catch (e) {
          console.error('Local save failed:', e);
        }
      },

      async loadAll() {
        if (isCloudConnected && firebaseDb) {
          try {
            const snap = await firebaseDb.ref(this.CLOUD_ROOT).once('value');
            const val = snap.val();
            if (val) {
              const merged = {
                teacherPassword: val.teacherPassword || "1234",
                curriculum: val.curriculum || JSON.parse(JSON.stringify(DEFAULT_CURRICULUM)),
                students: val.students || {},
                submissions: val.submissions || {},
                notifications: val.notifications || {}
              };
              this.saveLocal(merged);
              return merged;
            } else {
              const initial = this.loadLocal();
              await firebaseDb.ref(this.CLOUD_ROOT).set(initial);
              return initial;
            }
          } catch (e) {
            console.warn('Cloud load fallback to local:', e);
          }
        }
        return this.loadLocal();
      },

      async savePath(path, value, fullData) {
        this.saveLocal(fullData);
        if (isCloudConnected && firebaseDb) {
          try {
            await firebaseDb.ref(`${this.CLOUD_ROOT}/${path}`).set(value);
          } catch (e) {
            console.error('Cloud path save failed:', e);
          }
        }
      }
    };

    // =========================================================================

    const AppState = {
      data: StorageService.loadLocal(),
      user: null,
      studentView: 'roadmap',
      activeSession: 1,
      teacherTab: 'dashboard',
      teacherFilterGrade: 'all',
      teacherFilterStatus: 'all',

    function showToast(message, type = 'info') {
      AppState.toast = { message, type };
      renderApp();
      setTimeout(() => {
        if (AppState.toast && AppState.toast.message === message) {
          AppState.toast = null;
          renderApp();
        }
      }, 3200);
    }

    async function syncFromCloud(silent = true) {
      if (!isCloudConnected) return;
      AppState.isSyncing = true;
      if (!silent) renderApp();
      AppState.data = await StorageService.loadAll();
      AppState.isSyncing = false;
      renderApp();
    }

    // =========================================================================
    // 5. TTS 원어민 음성 발음 엔진
    // =========================================================================
    function speakEnglish(text, rate = 0.88) {
      if (!('speechSynthesis' in window)) {
        showToast('이 브라우저에서는 음성 듣기(TTS)를 지원하지 않아요.', 'error');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = rate;
      utterance.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.includes('en-US') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha')))
                     || voices.find(v => v.lang.includes('en'));
      if (preferred) utterance.voice = preferred;

      window.speechSynthesis.speak(utterance);
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // =========================================================================
    // 6. 4선지 노트 & S펜 필기 캔버스 매니저 (지우개 버그 완벽 수정)
    // =========================================================================
    const CanvasManager = {
      canvases: {},
      history: {},
      tool: 'pen',
      color: '#1E293B',
      lineWidth: 3.5,

      init(canvasId, options) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const container = canvas.parentElement;
        const rect = container.getBoundingClientRect();
        const width = Math.max(rect.width, 620);
        const height = options.height || 175;
        const dpr = window.devicePixelRatio || 1;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        this.canvases[canvasId] = { canvas, ctx, width, height, dpr, options };
        if (!this.history[canvasId]) this.history[canvasId] = [];

        this.drawFourLines(canvasId);

        if (options.initialDataUrl) {
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0, width, height);
            this.pushHistory(canvasId);
          };
          img.src = options.initialDataUrl;
        } else {
          this.pushHistory(canvasId);
        }

        this.bindEvents(canvasId);
      },

      drawFourLines(canvasId) {
        const item = this.canvases[canvasId];
        if (!item) return;
        const { ctx, width, height, options } = item;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);

        const padX = 24;
        const topY = Math.round(height * 0.22);
        const midY = Math.round(height * 0.48);
        const baseY = Math.round(height * 0.74);
        const descY = Math.round(height * 0.90);

        // 1선: Top line
        ctx.save();
        ctx.beginPath();
        ctx.strokeStyle = '#93C5FD';
        ctx.lineWidth = 1.5;
        ctx.moveTo(padX, topY);
        ctx.lineTo(width - padX, topY);
        ctx.stroke();

        // 2선: Middle dashed line
        ctx.beginPath();
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = '#CBD5E1';
        ctx.lineWidth = 1.4;
        ctx.moveTo(padX, midY);
        ctx.lineTo(width - padX, midY);
        ctx.stroke();
        ctx.setLineDash([]);

        // 3선: Red Baseline
        ctx.beginPath();
        ctx.strokeStyle = '#FDA4AF';
        ctx.lineWidth = 2.0;
        ctx.moveTo(padX, baseY);
        ctx.lineTo(width - padX, baseY);
        ctx.stroke();

        // 4선: Descender line
        ctx.beginPath();
        ctx.strokeStyle = '#93C5FD';
        ctx.lineWidth = 1.5;
        ctx.moveTo(padX, descY);
        ctx.lineTo(width - padX, descY);
        ctx.stroke();

        // 가이드 텍스트 렌더링
        if (options.guideText) {
          const text = options.guideText;
          const padLeft = padX + 12;
          const maxW = width - padLeft - 24;

          let fontSize = Math.round((baseY - topY) * 0.98);
          ctx.font = `400 ${fontSize}px 'Andika', sans-serif`;

          let measured = ctx.measureText(text).width;
          if (measured > maxW) {
            fontSize = Math.floor(fontSize * (maxW / measured));
            ctx.font = `400 ${fontSize}px 'Andika', sans-serif`;
          }

          ctx.fillStyle = 'rgba(148, 163, 184, 0.38)';
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(text, padLeft, baseY - 1);
        }
        ctx.restore();
      },

      bindEvents(canvasId) {
        const item = this.canvases[canvasId];
        if (!item) return;
        const { canvas, ctx } = item;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        const getPos = (e) => {
          const rect = canvas.getBoundingClientRect();
          return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        };

        canvas.onpointerdown = (e) => {
          if (e.pointerType === 'touch' && e.width > 12) return;
          isDrawing = true;
          canvas.setPointerCapture(e.pointerId);
          const pos = getPos(e);
          lastX = pos.x;
          lastY = pos.y;

          ctx.save();
          ctx.beginPath();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (this.tool === 'eraser') {
            // 지우개 모드: 학생이 쓴 글씨만 지우고 4선지 배경과 가이드라인을 보호하기 위해 지우개 전용 합성 모드 적용
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.lineWidth = 24;
          } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = this.color;
            const pressureFactor = (e.pointerType === 'pen' && e.pressure > 0) ? (0.65 + e.pressure * 0.75) : 1;
            ctx.lineWidth = this.lineWidth * pressureFactor;
          }
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(lastX + 0.1, lastY + 0.1);
          ctx.stroke();
          ctx.restore();
        };

        canvas.onpointermove = (e) => {
          if (!isDrawing) return;
          const pos = getPos(e);
          ctx.save();
          ctx.beginPath();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (this.tool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.lineWidth = 24;
          } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = this.color;
            const pressureFactor = (e.pointerType === 'pen' && e.pressure > 0) ? (0.65 + e.pressure * 0.75) : 1;
            ctx.lineWidth = this.lineWidth * pressureFactor;
          }
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
          ctx.restore();

          lastX = pos.x;
          lastY = pos.y;
        };

        const stopDrawing = (e) => {
          if (!isDrawing) return;
          isDrawing = false;
          if (e && e.pointerId) {
            try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
          }
          // 지우개 사용 직후 가이드라인과 4선지가 지워졌을 경우를 대비해 뼈대 라인 복원 오버레이 갱신
          if (this.tool === 'eraser') {
            this.redrawLinesOverlay(canvasId);
          }
          this.pushHistory(canvasId);
        };

        canvas.onpointerup = stopDrawing;
        canvas.onpointercancel = stopDrawing;
      },

      redrawLinesOverlay(canvasId) {
        const item = this.canvases[canvasId];
        if (!item) return;
        const { ctx, width, height, options } = item;
        const padX = 24;
        const topY = Math.round(height * 0.22);
        const midY = Math.round(height * 0.48);
        const baseY = Math.round(height * 0.74);
        const descY = Math.round(height * 0.90);

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 0.65;
        
        ctx.beginPath(); ctx.strokeStyle = '#93C5FD'; ctx.lineWidth = 1.2;
        ctx.moveTo(padX, topY); ctx.lineTo(width - padX, topY); ctx.stroke();

        ctx.beginPath(); ctx.setLineDash([6, 6]); ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 1.2;
        ctx.moveTo(padX, midY); ctx.lineTo(width - padX, midY); ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath(); ctx.strokeStyle = '#FDA4AF'; ctx.lineWidth = 1.6;
        ctx.moveTo(padX, baseY); ctx.lineTo(width - padX, baseY); ctx.stroke();

        ctx.beginPath(); ctx.strokeStyle = '#93C5FD'; ctx.lineWidth = 1.2;
        ctx.moveTo(padX, descY); ctx.lineTo(width - padX, descY); ctx.stroke();

        if (options.guideText) {
          const text = options.guideText;
          const padLeft = padX + 12;
          const maxW = width - padLeft - 24;
          let fontSize = Math.round((baseY - topY) * 0.98);
          ctx.font = `400 ${fontSize}px 'Andika', sans-serif`;
          let measured = ctx.measureText(text).width;
          if (measured > maxW) {
            fontSize = Math.floor(fontSize * (maxW / measured));
            ctx.font = `400 ${fontSize}px 'Andika', sans-serif`;
          }
          ctx.fillStyle = 'rgba(148, 163, 184, 0.32)';
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(text, padLeft, baseY - 1);
        }
        ctx.restore();
      },

      pushHistory(canvasId) {
        const item = this.canvases[canvasId];
        if (!item) return;
        const url = item.canvas.toDataURL('image/png');
        const list = this.history[canvasId] || [];
        if (list.length > 15) list.shift();
        list.push(url);
        this.history[canvasId] = list;
      },

      undo(canvasId) {
        const item = this.canvases[canvasId];
        const list = this.history[canvasId];
        if (!item || !list || list.length <= 1) {
          this.clear(canvasId);
          return;
        }
        list.pop();
        const prevUrl = list[list.length - 1];
        const img = new Image();
        img.onload = () => {
          item.ctx.globalCompositeOperation = 'source-over';
          item.ctx.clearRect(0, 0, item.width, item.height);
          item.ctx.drawImage(img, 0, 0, item.width, item.height);
        };
        img.src = prevUrl;
      },

      clear(canvasId) {
        this.drawFourLines(canvasId);
        this.history[canvasId] = [];
        this.pushHistory(canvasId);
      },

      exportImage(canvasId) {
        const item = this.canvases[canvasId];
        if (!item) return null;
        return item.canvas.toDataURL('image/jpeg', 0.85);
      }
    };

    // =========================================================================
    // 7. 교사용 빨간펜 첨삭 캔버스 매니저
    // =========================================================================
    const TeacherPenManager = {
      activeTarget: 'sentenceSolo1',
      color: '#EF4444',
      lineWidth: 3.5,
      layers: {},

      init(targetKey, baseImgSrc, existingAnnotationSrc) {
        const canvas = document.getElementById('teacher-pen-canvas');
        if (!canvas) return;
        const width = 680;
        const height = 190;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = '100%';
        canvas.style.maxWidth = width + 'px';
        canvas.style.height = 'auto';

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const bgImg = document.getElementById('teacher-base-img');
        if (bgImg && baseImgSrc) bgImg.src = baseImgSrc;

        const saved = this.layers[targetKey] || existingAnnotationSrc;
        if (saved) {
          const img = new Image();
          img.onload = () => ctx.drawImage(img, 0, 0, width, height);
          img.src = saved;
        }

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        const getPos = (e) => {
          const rect = canvas.getBoundingClientRect();
          const scaleX = width / rect.width;
          const scaleY = height / rect.height;
          return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        };

        canvas.onpointerdown = (e) => {
          isDrawing = true;
          canvas.setPointerCapture(e.pointerId);
          const pos = getPos(e);
          lastX = pos.x; lastY = pos.y;
          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.beginPath();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = this.color;
          ctx.lineWidth = this.lineWidth;
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(lastX + 0.1, lastY + 0.1);
          ctx.stroke();
          ctx.restore();
        };

        canvas.onpointermove = (e) => {
          if (!isDrawing) return;
          const pos = getPos(e);
          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.beginPath();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = this.color;
          ctx.lineWidth = this.lineWidth;
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
          ctx.restore();
          lastX = pos.x; lastY = pos.y;
        };

        const finish = (e) => {
          if (!isDrawing) return;
          isDrawing = false;
          if (e && e.pointerId) {
            try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
          }
          this.layers[targetKey] = canvas.toDataURL('image/png');
        };

        canvas.onpointerup = finish;
        canvas.onpointercancel = finish;
      },

      clearCurrent() {
        const canvas = document.getElementById('teacher-pen-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 680, 190);
        this.layers[this.activeTarget] = null;
      }
    };

    async function handleStudentLogin(e) {
      e.preventDefault();
      const studentId = document.getElementById('login-student-id').value.trim();
      const password = document.getElementById('login-student-pw').value.trim();

      if (!studentId || !password) {
        showToast('학번과 비밀번호를 모두 입력해 주세요!', 'error');
        return;
      }

      if (isCloudConnected) {
        AppState.isSyncing = true;
        renderApp();
        AppState.data = await StorageService.loadAll();
        AppState.isSyncing = false;
      }

      const registered = AppState.data.students[studentId];
      if (!registered) {
        showToast('등록되지 않은 학번입니다. 선생님께 문의해 주세요!', 'error');
        renderApp();
        return;
      }

      if (registered.password !== password) {
        showToast('비밀번호가 일치하지 않습니다. 다시 확인해 주세요!', 'error');
        renderApp();
        return;
      }

      const studentGrade = Number(registered.grade) || 1;
      AppState.user = {
        role: 'student',
        studentId,
        grade: studentGrade
      };
      AppState.studentView = 'roadmap';
      AppState.activeSession = 1;
      showToast(`${studentId} 학생, 환영해요! 오늘도 예쁘게 써봐요 ✨`, 'success');
      renderApp();
    }

    async function handleTeacherLogin(e) {

      if (isCloudConnected) {
        AppState.isSyncing = true;
        renderApp();

    async function saveTeacherFeedback(newStatus) {
      const subKey = AppState.teacherSelectedSubmission;
      const sub = AppState.data.submissions[subKey];
      if (!sub) return;

      const textFeedback = document.getElementById('teacher-feedback-text').value.trim();
      sub.status = newStatus;
      sub.teacherTextFeedback = textFeedback;
      sub.teacherAnnotations = { ...TeacherPenManager.layers };
      sub.reviewedAt = new Date().toLocaleString('ko-KR');

      AppState.data.submissions[subKey] = sub;

      const sid = sub.studentId;
      if (!AppState.data.notifications[sid]) AppState.data.notifications[sid] = [];
      const notifMsg = newStatus === 'resubmit'
        ? `[재제출 요청] ${sub.session}차시 필체 교정 피드백이 도착했어요! 확인 후 다시 써서 제출해 주세요.`
        : `[참 잘했어요!] ${sub.session}차시 필체 교정 선생님 피드백이 도착했어요!`;

      AppState.data.notifications[sid].unshift({
        id: 'notif_' + Date.now(),
        session: sub.session,
        grade: sub.grade,
        status: newStatus,
        message: notifMsg,
        feedbackText: textFeedback,
        createdAt: new Date().toLocaleString('ko-KR'),
        read: false
      });

      await StorageService.savePath(`submissions/${subKey}`, sub, AppState.data);
      await StorageService.savePath(`notifications/${sid}`, AppState.data.notifications[sid], AppState.data);

      AppState.teacherSelectedSubmission = null;
      showToast(newStatus === 'resubmit' ? '재제출 요청과 피드백을 전송했습니다.' : '피드백 및 승인 완료 처리되었습니다! ✨', 'success');
      renderApp();
    }

    async function handleBulkRegisterStudents() {
      const raw = document.getElementById('bulk-student-input').value.trim();
      const defaultPwMode = document.getElementById('bulk-default-pw-mode').value;
      if (!raw) {
        showToast('등록할 학번과 비밀번호 목록을 입력해 주세요!', 'error');
        return;
      }

      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let addedCount = 0;

      lines.forEach(line => {
        const cols = line.split(/[\t,]+|\s+/).map(c => c.trim()).filter(Boolean);
        if (cols.length === 0) return;

        let grade = 1;
        let studentId = '';
        let pw = '';

        if (cols.length >= 3 && ['1', '2', '3'].includes(cols[0])) {
          grade = Number(cols[0]);
          studentId = cols[1];
          pw = cols[2];
        } else {
          studentId = cols[0];
          const firstDigit = studentId.charAt(0);
          grade = ['1', '2', '3'].includes(firstDigit) ? Number(firstDigit) : 1;
          pw = cols[1] || '';
        }

        if (!studentId || isNaN(Number(studentId))) return;
        if (!pw) {
          pw = defaultPwMode === 'same_as_id' ? studentId : '1234';
        }

        AppState.data.students[studentId] = {
          studentId,
          grade,
          password: pw,
          updatedAt: new Date().toISOString()
        };
        addedCount++;
      });

      if (addedCount === 0) {
        showToast('인식된 유효한 학번 데이터가 없습니다.', 'error');
        return;
      }

      await StorageService.savePath('students', AppState.data.students, AppState.data);
      document.getElementById('bulk-student-input').value = '';
      showToast(`총 ${addedCount}명의 학생 계정이 일괄 등록되었습니다! 🎉`, 'success');
      renderApp();
    }

    function renderApp() {
      const root = document.getElementById('app');
      let html = '';

      if (AppState.toast) {
        const bgClass = AppState.toast.type === 'error'
          ? 'bg-rose-500 text-white'
          : AppState.toast.type === 'success'
            ? 'bg-emerald-500 text-white'
            : 'bg-slate-800 text-white';
        html += `
          <div class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-xl font-cute text-base flex items-center gap-2 ${bgClass} animate-bounce">
            <span>${AppState.toast.type === 'error' ? '⚠️' : '✨'}</span>
            <span>${AppState.toast.message}</span>
          </div>
        `;
      }

      if (!AppState.user) {
        html += renderLoginView();
      } else if (AppState.user.role === 'student') {
        html += renderStudentHeader();
        if (AppState.studentView === 'roadmap') {
          html += renderStudentRoadmap();
        } else {
          html += renderStudentPractice();
        }
      } else if (AppState.user.role === 'teacher') {
        html += renderTeacherHeader();
        if (AppState.teacherTab === 'dashboard') {
          html += renderTeacherDashboard();
        } else {
          html += renderTeacherManageView();
        }
        if (AppState.teacherSelectedSubmission) {
          html += renderTeacherFeedbackModal();
        }
      }

      root.innerHTML = html;
    }

              <div class="font-title text-3xl font-bold text-rose-600 mt-1">${resubmitCount}건</div>

                      class="w-full px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-sm font-handwriting font-bold" />
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-[11px] text-slate-400">단어 뜻</label>
                    <input type="text" value="${item.wordMeaning}" onchange="updateCurriculumField(${mg}, ${idx}, 'wordMeaning', this.value)"
                      class="w-full px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-sm" />
                  </div>
                  <div class="md:col-span-4">
                    <label class="block text-[11px] text-slate-400">핵심 문장</label>
                    <input type="text" value="${item.sentence}" onchange="updateCurriculumField(${mg}, ${idx}, 'sentence', this.value)"
                      class="w-full px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-sm font-handwriting" />
                  </div>
                  <div class="md:col-span-3">
                    <label class="block text-[11px] text-slate-400">문장 해석</label>
                    <input type="text" value="${item.sentenceMeaning}" onchange="updateCurriculumField(${mg}, ${idx}, 'sentenceMeaning', this.value)"
                      class="w-full px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-sm" />
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="mt-5 flex justify-end">
              <button onclick="saveCurriculumChanges()"
                class="px-6 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-cute text-base shadow btn-bouncy">
                💾 10차시 커리큘럼 변경사항 저장
              </button>
            </div>
          </section>

          <section class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-rose-100 soft-shadow">
            <h2 class="font-cute text-xl text-slate-800 mb-2">🔒 교사 대시보드 비밀번호 변경</h2>
            <div class="flex flex-wrap items-center gap-3 max-w-md">
              <input id="new-teacher-pw" type="password" placeholder="새 교사 비밀번호 (4자리 이상)"
                class="flex-1 px-4 py-2.5 rounded-2xl bg-rose-50/40 border-2 border-rose-100 focus:border-rose-400 outline-none text-sm" />
              <button onclick="updateTeacherPassword()"
                class="px-5 py-2.5 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-cute text-sm shadow btn-bouncy">
                저장
              </button>
            </div>
          </section>
        </main>
      `;
    }

    renderApp();
    syncFromCloud(true);
  </script>
</body>
</html>
